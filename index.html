<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AWS Certification Practice Exams</title>
  <style>
    :root { --bg: #f3f5f9; --card: #ffffff; --text: #1f2937; --muted: #6b7280; --border: #e2e6ee; --primary: #2563eb; --primary-soft: #e8efff;
      --shadow: 0 1px 3px rgba(16, 24, 40, .08), 0 4px 16px rgba(16, 24, 40, .05); }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f141b; --card: #182029; --text: #e5e9f0; --muted: #98a2b3; --border: #2a3441; --primary: #4f8cff; --primary-soft: #1d2b46; --shadow: 0 1px 3px rgba(0, 0, 0, .4); }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    .lead { margin: 0 0 28px; color: var(--muted); }
    h2 { margin: 28px 0 12px; font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .cert { display: flex; flex-direction: column; gap: 6px; padding: 18px; background: var(--card); border: 2px solid var(--border); border-radius: 14px; box-shadow: var(--shadow);
      color: inherit; text-decoration: none; }
    .cert b { font-size: 1.02rem; }
    .cert span { font-size: .85rem; color: var(--muted); }
    a.cert:hover, a.cert:focus-visible { border-color: var(--primary); background: var(--primary-soft); outline: none; }
    a.cert span { color: var(--primary); font-weight: 600; }
    div.cert { opacity: .55; }
    @media (max-width: 640px) { .wrap { padding: 20px 10px 40px; } }
  </style>
</head>
<body>
<div class="wrap">
  <h1>AWS Certification Practice Exams</h1>
  <p class="lead">Choose a certification to start practising. Greyed-out ones have no questions yet.</p>
  <div id="catalog"></div>
</div>
<script>
// A certification with an `id` has its files in assets/<id>/ (questions.txt, solutions.txt); add the `id` once they exist.
const CERTS = [
  { level: 'Foundational', name: 'Cloud Practitioner' },
  { level: 'Foundational', name: 'AI Practitioner' },
  { level: 'Associate', name: 'Solutions Architect - Associate (SAA-C03)', id: 'SAA-03' },
  { level: 'Associate', name: 'Developer - Associate' },
  { level: 'Associate', name: 'SysOps Administrator - Associate' },
  { level: 'Associate', name: 'Data Engineer - Associate' },
  { level: 'Associate', name: 'Machine Learning Engineer - Associate' },
  { level: 'Professional', name: 'Solutions Architect - Professional' },
  { level: 'Professional', name: 'DevOps Engineer - Professional' },
  { level: 'Specialty', name: 'Advanced Networking - Specialty' },
  { level: 'Specialty', name: 'Security - Specialty' }
];

const root = document.getElementById('catalog');
for (const level of [...new Set(CERTS.map(c => c.level))]) {
  const h = document.createElement('h2');
  h.textContent = level;
  const grid = document.createElement('div');
  grid.className = 'grid';
  for (const c of CERTS.filter(x => x.level === level)) {
    const card = document.createElement(c.id ? 'a' : 'div');
    card.className = 'cert';
    if (c.id) card.href = 'viewer.html?cert=' + encodeURIComponent(c.id);
    const title = document.createElement('b');
    title.textContent = 'AWS Certified ' + c.name;
    const note = document.createElement('span');
    note.textContent = c.id ? 'Start practice \u2192' : 'Coming soon';
    card.append(title, note);
    grid.append(card);
  }
  root.append(h, grid);
}
</script>
</body>
</html>
